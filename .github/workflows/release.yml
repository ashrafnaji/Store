name: Build and release APKs

# Triggers on tags like v1.0.0, v1.2.3 -> versionName "1.0.0" (must be numeric x.y.z so the
# in-app UpdateManager can compare it against the currently installed version).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release APKs (arm64-v8a, armeabi-v7a, x86, x86_64)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - run: gradle assembleRelease --no-daemon
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove keystore
        if: always()
        run: rm -f keystore.jks

      - name: Publish GitHub release with APKs
        uses: softprops/action-gh-release@v2
        with:
          name: "Store v${{ steps.version.outputs.name }}"
          files: app/build/outputs/apk/release/*.apk

      - name: Update latest.json
        # The in-app updater reads this from raw.githubusercontent.com instead of calling the
        # REST API directly, since that API rate-limits unauthenticated requests per IP.
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          TAG="${GITHUB_REF_NAME}"
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "assets": {
              "arm64-v8a": "https://github.com/${{ github.repository }}/releases/download/$TAG/app-arm64-v8a-release.apk",
              "armeabi-v7a": "https://github.com/${{ github.repository }}/releases/download/$TAG/app-armeabi-v7a-release.apk",
              "x86": "https://github.com/${{ github.repository }}/releases/download/$TAG/app-x86-release.apk",
              "x86_64": "https://github.com/${{ github.repository }}/releases/download/$TAG/app-x86_64-release.apk"
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for $TAG" || exit 0
          git push origin HEAD:main
